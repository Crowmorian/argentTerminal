<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="Choose a game: Sentinel Terminal, Halloween Quiz, Image Memory, or Name That Sound.">
  <title>Game Hub</title>
  <link rel="stylesheet" href="../styles.css?v=sentinel-08">
  <link rel="stylesheet" href="./hub.css?v=hub-01">
</head>
<body>
  <div class="fortress-wall" aria-hidden="true"></div>
  <main class="hub-shell">
    <section class="console hub-console" aria-labelledby="hub-title">
      <div class="console-topline"><span>GAME HUB</span><span>CHOOSE A GAME</span></div>
      <div class="console-body">
        <h1 id="hub-title">Choose a Game</h1>
        <nav class="hub-games" aria-label="Games">
          <a class="hub-game" href="../">
            <span class="hub-number" aria-hidden="true">01</span>
            <span class="hub-game-title">Sentinel Terminal</span>
            <span class="hub-open" aria-hidden="true">OPEN <span>→</span></span>
          </a>
          <a class="hub-game" href="../quiz/">
            <span class="hub-number" aria-hidden="true">02</span>
            <span class="hub-game-title">Halloween Quiz</span>
            <span class="hub-open" aria-hidden="true">OPEN <span>→</span></span>
          </a>
          <a class="hub-game" href="../image-game/">
            <span class="hub-number" aria-hidden="true">03</span>
            <span class="hub-game-title">Image Memory</span>
            <span class="hub-open" aria-hidden="true">OPEN <span>→</span></span>
          </a>
          <a class="hub-game" href="../sound-game/">
            <span class="hub-number" aria-hidden="true">04</span>
            <span class="hub-game-title">Name That Sound</span>
            <span class="hub-open" aria-hidden="true">OPEN <span>→</span></span>
          </a>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
