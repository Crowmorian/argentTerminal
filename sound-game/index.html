<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="Listen to ten mystery sounds and compare your answers at the end.">
  <title>Name That Sound</title>
  <link rel="stylesheet" href="../styles.css?v=sentinel-08">
  <link rel="stylesheet" href="./sound.css?v=sound-01">
  <script type="module" src="./sound.js?v=sound-01"></script>
</head>
<body class="sound-page">
  <div class="fortress-wall" aria-hidden="true"></div>
  <main class="sound-shell">
    <section class="console sound-console" aria-label="Sound game">
      <div class="console-topline"><span>NAME THAT SOUND</span><span id="round-status">READY TO START</span></div>
      <div class="console-body">
        <section id="start-screen" class="sound-start" aria-labelledby="start-title">
          <h1 id="start-title" tabindex="-1">Name That Sound</h1>
          <button id="start-button" class="primary-button sound-action" type="button" disabled>START GAME <span aria-hidden="true">&#8594;</span></button>
          <p id="game-error" class="error-note" role="alert" hidden>The game is unavailable. Please check the sound data.</p>
        </section>

        <section id="sound-screen" hidden aria-labelledby="sound-title">
          <p id="sound-count" class="sound-count"></p>
          <progress id="sound-progress" value="0" max="10" aria-label="Sounds completed"></progress>
          <h2 id="sound-title" tabindex="-1">What is this sound from?</h2>
          <div class="sound-player">
            <button id="play-button" class="sound-play" type="button">PLAY SOUND</button>
            <button id="stop-button" class="text-button" type="button" hidden>STOP</button>
            <p id="playback-status" role="status" aria-live="polite">Ready to play.</p>
          </div>
          <form id="answer-form" novalidate>
            <label class="sound-answer-label" for="answer-input">Your answer</label>
            <input id="answer-input" type="text" placeholder="Enter your answer" autocomplete="off" required>
            <button id="next-button" class="primary-button sound-action" type="submit" disabled>NEXT <span aria-hidden="true">&#8594;</span></button>
          </form>
        </section>

        <section id="results-screen" hidden aria-labelledby="results-title">
          <h2 id="results-title" tabindex="-1">Your answers</h2>
          <ol id="results-list" class="sound-results"></ol>
          <button id="restart-button" class="primary-button sound-action" type="button">PLAY AGAIN <span aria-hidden="true">&#8594;</span></button>
        </section>
        <noscript><p class="error-note">Enable JavaScript to play the sound game.</p></noscript>
      </div>
    </section>
  </main>
</body>
</html>
